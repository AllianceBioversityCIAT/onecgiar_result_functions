name: Trigger Jenkins Job Sync

on:
  # dev and main removed (Sync DEV cutover): a push to dev runs result-sync-dev-cicd.yml -> clarisa-result-management-sync-cd,
  # which deploys without Docker on the Jenkins agent. The legacy job clarisa-result-management-sync (it always deployed
  # the dev branch, also on pushes to main) stays available through workflow_dispatch (manual recovery).
  workflow_dispatch: # Allows manual execution

jobs:
  trigger-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the branch and build Jenkins URL
      - name: Get branch name and build Jenkins URL
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          JENKINS_URL="https://automation.prms.cgiar.org/job/clarisa-result-management-sync/build"
          echo "Jenkins job URL for the branch $BRANCH_NAME is: $JENKINS_URL"
          echo "JENKINS_URL=${JENKINS_URL}" >> $GITHUB_ENV

      # Step 2: Run curl to trigger the job
      - name: Trigger Jenkins Job
        run: |
          curl -X POST ${{ env.JENKINS_URL }} --user ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}
        env:
          JENKINS_URL: ${{ env.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
